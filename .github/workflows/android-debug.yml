name: Android debug APK

on:
  push:
    branches: [sprint/million-kicks-launch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify and build debug APK
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug
      - name: Create APK digest
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: clean-reps-mobile-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
