[versions]
agp = "8.7.3"
# RootEncoder 2.7.0 publishes Kotlin metadata 2.2.0. Kotlin 2.2.21 is
# compatible with the pinned Gradle 8.11.1/AGP 8.7.3 build while reading that
# metadata; keep the Android API and AGP pins unchanged for the gym baseline.
kotlin = "2.2.21"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
camerax = "1.4.1"
rootEncoder = "2.7.0"
# Test-only. Matches the kotlinx-coroutines version the app runtime already
# resolves (RootEncoder 2.7.0 requests 1.10.2; AndroidX's 1.7.3 is upgraded).
coroutines = "1.10.2"
# Test-only, for the one Robolectric smoke render of CameraScreen. Robolectric's
# compatibility table runs SDK 35 on Java 17 (the host's only JDK) from 4.15;
# its SDK 36 needs Java 21, so the test pins SDK 35.
robolectric = "4.16.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.15.0" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-video = { module = "androidx.camera:camera-video", version.ref = "camerax" }
camerax-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
# RootEncoder 2.7.0 is the last verified SRT-capable release whose AAR metadata
# accepts the launch build's pinned API 35/AGP 8.7.3 environment. SrtStream is
# supplied by the `library` module; unused transports are excluded in app code.
root-encoder = { module = "com.github.pedroSG94.RootEncoder:library", version.ref = "rootEncoder" }
junit = { module = "junit:junit", version = "4.13.2" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
# Version from the compose BOM.
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
